openapi: 3.1.0
info:
  title: Rigweda API
  version: 0.8.0
  description: Independently implemented HR and payroll platform API.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and establish a rotating session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Authentication succeeded; refresh token set as an HTTP-only cookie }
        "401": { description: Invalid credentials }
        "423": { description: Account temporarily locked }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh session and issue an access token
      responses:
        "200": { description: Session rotated }
        "401": { description: Session missing or invalid }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh session
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
        "401": { description: Authentication required }
  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the current password and revoke other sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        "204": { description: Password changed }
        "401": { description: Current password is incorrect }
        "422": { description: Password policy validation failed }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Prepare password-reset instructions without disclosing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Generic reset response }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Consume a one-time reset token and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        "204": { description: Password reset }
        "422": { description: Reset token invalid, expired, or already used }
  /auth/sessions:
    get:
      tags: [Authentication]
      summary: List active sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Active sessions }
    delete:
      tags: [Authentication]
      summary: Revoke every session except the current session
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Other sessions revoked }
  /auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: Revoke one active session
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Session revoked }
        "404": { description: Session not found }
  /auth/preferences:
    get:
      tags: [Preferences]
      summary: Retrieve personal preferences
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Personal preferences }
    patch:
      tags: [Preferences]
      summary: Update personal preferences
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Updated personal preferences }
  /access/users:
    get:
      tags: [Access control]
      summary: List users in the authenticated organization
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, all] } }
      responses:
        "200": { description: Paginated organization-user collection }
        "403": { description: Users-manage permission required }
    post:
      tags: [Access control]
      summary: Create or attach a user and assign an organization role
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: User membership created }
        "409": { description: User is already an organization member }
  /access/users/{userId}:
    patch:
      tags: [Access control]
      summary: Update a user membership or role
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: User membership updated }
        "404": { description: User membership not found }
  /access/roles:
    get:
      tags: [Access control]
      summary: List organization roles and assigned permissions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Organization roles }
    post:
      tags: [Access control]
      summary: Create a custom role
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Role created }
        "409": { description: Role name conflict }
  /access/roles/{roleId}:
    patch:
      tags: [Access control]
      summary: Update a role and its permissions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Role updated }
        "422": { description: Protected role cannot be reduced }
  /access/permissions:
    get:
      tags: [Access control]
      summary: List the permission catalog
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Permission catalog }
  /employees:
    get:
      tags: [Employees]
      summary: Search and filter the organization employee directory
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [preboarding, probation, active, on_leave, notice_period, suspended, terminated, all] } }
        - { name: employmentType, in: query, schema: { type: string, enum: [full_time, part_time, contract, intern, temporary, apprentice, all] } }
        - { name: departmentId, in: query, schema: { type: string, format: uuid } }
        - { name: workLocationId, in: query, schema: { type: string, format: uuid } }
        - { name: managerEmployeeId, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: [name, employeeNumber, joinDate, status] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200": { description: Paginated employee directory }
    post:
      tags: [Employees]
      summary: Create an employee profile and initial lifecycle history
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201": { description: Employee created }
        "409": { description: Employee number, work email, or linked user conflict }
        "422": { description: Validation or organization-reference error }
  /employees/summary:
    get:
      tags: [Employees]
      summary: Retrieve employee lifecycle totals
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Employee summary counts }
  /employees/metadata:
    get:
      tags: [Employees]
      summary: Retrieve departments, job titles, locations, managers, and available login accounts
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Employee form metadata }
  /employees/export:
    get:
      tags: [Employees]
      summary: Export the authorized employee directory as CSV
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: UTF-8 CSV export
          content: { text/csv: { schema: { type: string } } }
        "403": { description: Employee-export permission required }
  /employees/next-number:
    get:
      tags: [Employees]
      summary: Suggest the next available employee number
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Suggested organization-scoped employee number }
  /employees/upcoming-events:
    get:
      tags: [Employees]
      summary: List upcoming birthdays, anniversaries, and probation endings
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 45 } }
      responses:
        "200": { description: Upcoming employee events }
  /employees/organization-tree:
    get:
      tags: [Employees]
      summary: Retrieve the manager and direct-report hierarchy
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Organization reporting tree }
  /employees/archived:
    get:
      tags: [Employees]
      summary: List reversibly archived employee records
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated archived employees }
        "403": { description: Employee-lifecycle permission required }
  /employees/me:
    get:
      tags: [Employees]
      summary: Retrieve the employee profile linked to the current login
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current employee profile }
        "404": { description: Login has no linked employee profile }
  /employees/me/profile:
    put:
      tags: [Employees]
      summary: Complete or update the current employee's self-service profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Self-service profile saved }
        "409": { description: Optimistic version conflict }
  /employees/bulk-update:
    put:
      tags: [Employees]
      summary: Assign department, job title, location, manager, mode, or type in bulk
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Number of employee records updated }
        "403": { description: Employee-bulk permission required }
  /employees/{employeeId}:
    parameters:
      - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Employees]
      summary: Retrieve a private employee profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Employee profile with addresses and emergency contacts }
        "403": { description: Sensitive-employee permission required }
        "404": { description: Employee not found }
    patch:
      tags: [Employees]
      summary: Update employee identity, employment assignment, or contact data
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Employee updated }
        "409": { description: Optimistic version conflict }
        "422": { description: Invalid reference, reporting cycle, or dates }
  /employees/{employeeId}/status:
    post:
      tags: [Employees]
      summary: Apply a validated employee lifecycle transition
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Employee status changed and recorded in history }
        "422": { description: Invalid lifecycle transition }
  /employees/{employeeId}/history:
    get:
      tags: [Employees]
      summary: Retrieve job, lifecycle, and change history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Employee history }
        "404": { description: Employee not found }
  /employees/{employeeId}/archive:
    post:
      tags: [Employees]
      summary: Reversibly archive an employee and deactivate their membership
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Employee archived }
        "409": { description: Optimistic version conflict }
  /employees/{employeeId}/restore:
    post:
      tags: [Employees]
      summary: Restore an archived employee and reactivate their membership
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Employee restored }
        "409": { description: Optimistic version conflict }
  /employees/{employeeId}/reopen-profile:
    post:
      tags: [Employees]
      summary: Reopen a completed employee profile for correction
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Profile reopened }
  /employees/{employeeId}/sensitive-records:
    put:
      tags: [Employees]
      summary: Replace protected identifiers and document metadata
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Protected records replaced; identifier values remain masked in responses }
        "403": { description: Employee-documents permission required }
  /employees/{employeeId}/identifiers:
    post:
      tags: [Employees]
      summary: Encrypt and add a protected employee identifier
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Identifier stored with AES-256-GCM encryption }
  /employees/{employeeId}/identifiers/{recordId}:
    delete:
      tags: [Employees]
      summary: Remove a protected employee identifier
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Identifier removed }
  /employees/{employeeId}/documents:
    post:
      tags: [Employees]
      summary: Add protected employee document metadata and storage URL
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Document metadata added }
  /employees/{employeeId}/documents/{recordId}:
    delete:
      tags: [Employees]
      summary: Remove protected employee document metadata
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Document metadata removed }
  /structure/summary:
    get:
      tags: [Organization structure]
      summary: Retrieve structure totals and unassigned-employee counts
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Department, designation, and location summary }
  /structure/metadata:
    get:
      tags: [Organization structure]
      summary: Retrieve eligible department-head employees
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Structure form metadata }
  /structure/departments/tree:
    get:
      tags: [Organization structure]
      summary: Retrieve the complete nested department hierarchy
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Nested department tree with assignment counts }
  /structure/departments:
    get:
      tags: [Organization structure]
      summary: Search and filter departments
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated departments with employee and child counts }
    post:
      tags: [Organization structure]
      summary: Create a department
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Department created and audited }
        "422": { description: Parent or head belongs to another organization }
  /structure/departments/{entityId}:
    get:
      tags: [Organization structure]
      summary: Retrieve a department
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Department details }
    patch:
      tags: [Organization structure]
      summary: Update, activate, deactivate, or move a department
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Department updated and audited }
        "409": { description: Optimistic version conflict }
        "422": { description: Invalid hierarchy cycle or reference }
  /structure/departments/{entityId}/history:
    get:
      tags: [Organization structure]
      summary: Retrieve department change history
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Immutable department audit history }
  /structure/job-titles:
    get:
      tags: [Organization structure]
      summary: Search and filter designations
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated designations with employee counts }
    post:
      tags: [Organization structure]
      summary: Create a designation with level, grade, and career track
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Designation created and audited }
  /structure/job-titles/{entityId}:
    get:
      tags: [Organization structure]
      summary: Retrieve a designation
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Designation details }
    patch:
      tags: [Organization structure]
      summary: Update, activate, or deactivate a designation
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Designation updated and audited }
        "409": { description: Optimistic version conflict }
  /structure/job-titles/{entityId}/history:
    get:
      tags: [Organization structure]
      summary: Retrieve designation change history
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Immutable designation audit history }
  /structure/work-locations:
    get:
      tags: [Organization structure]
      summary: Search and filter work locations
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated locations with employee counts }
    post:
      tags: [Organization structure]
      summary: Create a regional work location
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Work location created and audited }
  /structure/work-locations/{entityId}:
    get:
      tags: [Organization structure]
      summary: Retrieve a work location
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Work location details }
    patch:
      tags: [Organization structure]
      summary: Update, activate, or deactivate a work location
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Work location updated and audited }
        "409": { description: Optimistic version conflict }
  /structure/work-locations/{entityId}/history:
    get:
      tags: [Organization structure]
      summary: Retrieve work-location change history
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Immutable work-location audit history }
  /attendance/metadata:
    get:
      tags: [Attendance]
      summary: Retrieve employees and active shifts for attendance forms
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Attendance form metadata }
  /attendance/me/today:
    get:
      tags: [Attendance]
      summary: Retrieve the current employee's shift and attendance state
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current organization date, assigned shift, and attendance record }
        "404": { description: Login has no linked employee profile }
  /attendance/me/punch:
    post:
      tags: [Attendance]
      summary: Record an immutable clock or break punch
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [clock_in, break_start, break_end, clock_out] }
                latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
                longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
                deviceInfo: { type: [string, "null"], maxLength: 300 }
      responses:
        "200": { description: Punch recorded and attendance totals recalculated }
        "409": { description: Punch action is invalid for the current state }
        "422": { description: Policy or geolocation requirement failed }
  /attendance/me/regularizations:
    get:
      tags: [Attendance]
      summary: List the current employee's correction requests
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated self-service correction requests }
    post:
      tags: [Attendance]
      summary: Request an attendance correction
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Correction request submitted }
        "409": { description: A pending request already exists for this attendance date }
        "422": { description: Correction policy or time window validation failed }
  /attendance/me/regularizations/{requestId}/cancel:
    post:
      tags: [Attendance]
      summary: Cancel a pending self-service correction request
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Pending request cancelled }
        "409": { description: Optimistic version conflict or request no longer pending }
  /attendance/daily/summary:
    get:
      tags: [Attendance]
      summary: Retrieve attendance totals and exception counts for one date
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Daily present, absent, late, weekly-off, and open-punch totals }
  /attendance/daily:
    get:
      tags: [Attendance]
      summary: Search the employee attendance register for one date
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [not_marked, present, absent, half_day, on_leave, holiday, weekly_off, missing_punch, late, overtime, open_punch, all] } }
      responses:
        "200": { description: Paginated daily attendance register }
  /attendance/records:
    get:
      tags: [Attendance]
      summary: Search historical attendance records
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dateFrom, in: query, required: true, schema: { type: string, format: date } }
        - { name: dateTo, in: query, required: true, schema: { type: string, format: date } }
        - { name: employeeId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200": { description: Paginated historical attendance records }
    put:
      tags: [Attendance]
      summary: Create or correct an attendance record with optimistic locking
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Attendance record corrected and audit history appended }
        "409": { description: Optimistic version conflict }
  /attendance/records/export:
    get:
      tags: [Attendance]
      summary: Export filtered attendance records as spreadsheet-safe CSV
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dateFrom, in: query, required: true, schema: { type: string, format: date } }
        - { name: dateTo, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: UTF-8 attendance CSV export
          content: { text/csv: { schema: { type: string } } }
  /attendance/records/{recordId}:
    get:
      tags: [Attendance]
      summary: Retrieve one attendance record with immutable punches
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Attendance record and punch timeline }
        "404": { description: Attendance record not found }
  /attendance/records/{recordId}/history:
    get:
      tags: [Attendance]
      summary: Retrieve the manual-correction audit history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Immutable attendance change history }
  /attendance/policy:
    get:
      tags: [Attendance]
      summary: Retrieve the organization attendance policy
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Attendance thresholds and self-service policy }
    patch:
      tags: [Attendance]
      summary: Update attendance calculations, weekends, and punch policy
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Attendance policy updated }
        "409": { description: Optimistic version conflict }
  /attendance/shifts:
    get:
      tags: [Attendance]
      summary: Search shift templates
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated shift templates with assignment counts }
    post:
      tags: [Attendance]
      summary: Create a reusable shift template
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Shift template created }
        "409": { description: Shift code conflict }
  /attendance/shifts/{shiftId}:
    parameters:
      - { name: shiftId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Attendance]
