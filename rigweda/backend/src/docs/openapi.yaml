components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EmployeeInput:
      type: object
      required: [employeeNumber, firstName, lastName, employmentType, joinDate]
      properties:
        employeeNumber: { type: string, pattern: "^[A-Z0-9][A-Z0-9_/-]{1,39}$" }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        middleName: { type: [string, "null"], maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        preferredName: { type: [string, "null"], maxLength: 100 }
        userId: { type: [string, "null"], format: uuid }
        workEmail: { type: [string, "null"], format: email }
        personalEmail: { type: [string, "null"], format: email }
        workPhone: { type: [string, "null"] }
        personalPhone: { type: [string, "null"] }
        dateOfBirth: { type: [string, "null"], format: date }
        employmentStatus: { type: string, enum: [preboarding, probation, active] }
        employmentType: { type: string, enum: [full_time, part_time, contract, intern, temporary, apprentice] }
        workMode: { type: string, enum: [onsite, hybrid, remote] }
        joinDate: { type: string, format: date }
        departmentId: { type: [string, "null"], format: uuid }
        jobTitleId: { type: [string, "null"], format: uuid }
        workLocationId: { type: [string, "null"], format: uuid }
        managerEmployeeId: { type: [string, "null"], format: uuid }
        addresses: { type: array, maxItems: 3, items: { type: object } }
        emergencyContacts: { type: array, maxItems: 10, items: { type: object } }
    OrganizationInput:
      type: object
      properties:
        code: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$" }
        name: { type: string, minLength: 2, maxLength: 160 }
        legalName: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        website: { type: [string, "null"], format: uri }
        timezone: { type: string }
        locale: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        theme:
          type: object
          properties:
            preset: { type: string, enum: [emerald, ocean, indigo, amber, rose, custom] }
            appearance: { type: string, enum: [light, dark, system] }
    Success:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
